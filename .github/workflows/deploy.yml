name: Build & Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

# Évite deux déploiements concurrents qui se marcheraient dessus
concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to OVH (SFTP via lftp)
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -u agrarianug --env-password sftp://ftp.cluster126.hosting.ovh.net <<'SCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 3
          set mirror:parallel-transfer-count 5
          lcd dist
          mirror -R --delete --verbose=1 . www
          bye
          SCRIPT
